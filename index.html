<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhetigen | Сандық кәсіби аспап</title>
  <style>
    :root {
      --bg-surface: #0a0705;
      --wood-frame: #24140b;
      --wood-top: #3b2214;
      --gold-accent: #dfb235;
      --bone-color: #f4ede1;
      --string-base: #d2c2a4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-surface);
      color: #ede4dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold-accent);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(223,178,53,0.3);
    }

    .tagline {
      font-size: 0.9rem;
      color: #9e8e82;
      margin-top: 4px;
    }

    .instrument-body {
      width: 100%;
      max-width: 920px;
      height: 380px;
      background: linear-gradient(180deg, #2b170c 0%, #150a05 100%);
      border: 4px solid #482614;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), inset 0 0 50px rgba(0,0,0,0.7);
      position: relative;
      padding: 30px 40px;
      touch-action: none;
    }

    .sound-hole {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #080402;
      border: 2px solid rgba(223,178,53,0.25);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.9);
    }
    .sound-hole.tl { top: 20px; left: 24px; }
    .sound-hole.br { bottom: 20px; right: 24px; }

    .strings-stage {
      position: relative;
      width: 100%;
      height: 280px;
      display: flex;
      justify-content: space-between;
    }

    .string-track {
      position: relative;
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .string-wire {
      width: 2px;
      height: 100%;
      background: linear-gradient(90deg, #9f8c6f, #fff1d8, #74634a);
      box-shadow: 0 0 4px rgba(255,241,216,0.25);
      pointer-events: none;
      transition: box-shadow 0.1s;
    }

    .string-track.plucked .string-wire {
      box-shadow: 0 0 16px var(--gold-accent);
      background: #ffffff;
    }

    .asyq-bridge {
      position: absolute;
      width: 24px;
      height: 38px;
      background: linear-gradient(135deg, #f7f3ea 0%, #cebeaa 100%);
      border-radius: 6px;
      left: 50%;
      transform: translate(-50%, 50%);
      cursor: ns-resize;
      box-shadow: 0 5px 12px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,255,255,0.9);
      z-index: 10;
      touch-action: none;
    }

    .asyq-bridge::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 20%;
      width: 60%;
      height: 2px;
      background: #8e785e;
      opacity: 0.5;
    }

    .note-label {
      position: absolute;
      bottom: -28px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold-accent);
      pointer-events: none;
      letter-spacing: 1px;
    }

    .panel-controls {
      margin-top: 24px;
      display: flex;
      gap: 16px;
    }

    .action-btn {
      background: #24140b;
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--gold-accent);
      color: #120904;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Жетіген</div>
    <div class="tagline">Физикалық синтез бен жылжымалы асық-тиектер жүйесі</div>
  </header>

  <div class="instrument-body" id="zhetigenBody">
    <div class="sound-hole tl"></div>
    <div class="sound-hole br"></div>

    <div class="strings-stage" id="stringsArea">
      <!-- Ішектер динамикалық түрде генерацияланады -->
    </div>
  </div>

  <div class="panel-controls">
    <button class="action-btn" id="resetTunings">Бұрауды қалпына келтіру</button>
  </div>

  <script>
    class ZhetigenSynth {
      constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.8;

        this.convolver = this.ctx.createConvolver();
        this.convolver.buffer = this.buildBodyImpulse(0.8, 0.35);

        this.convolver.connect(this.master);
        this.master.connect(this.ctx.destination);
      }

      buildBodyImpulse(duration, decay) {
        const rate = this.ctx.sampleRate;
        const total = Math.floor(rate * duration);
        const impulse = this.ctx.createBuffer(2, total, rate);
        for (let c = 0; c < 2; c++) {
          const chData = impulse.getChannelData(c);
          for (let i = 0; i < total; i++) {
            chData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (rate * (decay / 4)));
          }
        }
        return impulse;
      }

      pluck(freq, velocity = 0.9) {
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const rate = this.ctx.sampleRate;
        const period = Math.max(Math.round(rate / freq), 64);
        const noise = this.ctx.createBuffer(1, period, rate);
        const bufferData = noise.getChannelData(0);
        for (let i = 0; i < period; i++) {
          bufferData[i] = (Math.random() * 2 - 1) * velocity;
        }

        const src = this.ctx.createBufferSource();
        src.buffer = noise;

        const delay = this.ctx.createDelay(1.0);
        delay.delayTime.value = 1.0 / freq;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = Math.min(freq * 3.8, 7500);

        const feedback = this.ctx.createGain();
        feedback.gain.value = 0.985;

        src.connect(delay);
        delay.connect(filter);
        filter.connect(feedback);
        feedback.connect(delay);

        const ampEnvelope = this.ctx.createGain();
        ampEnvelope.gain.setValueAtTime(velocity, this.ctx.currentTime);
        ampEnvelope.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);

        filter.connect(ampEnvelope);
        ampEnvelope.connect(this.master);
        ampEnvelope.connect(this.convolver);

        src.start();
        src.stop(this.ctx.currentTime + (period / rate));

        setTimeout(() => {
          src.disconnect();
          delay.disconnect();
          filter.disconnect();
          feedback.disconnect();
          ampEnvelope.disconnect();
        }, 2600);
      }
    }

    const synthEngine = new ZhetigenSynth();
    const stage = document.getElementById('stringsArea');

    const scaleConfig = [
      { key: "1", note: "C4", baseFreq: 261.63, pos: 0.70 },
      { key: "2", note: "D4", baseFreq: 293.66, pos: 0.65 },
      { key: "3", note: "E4", baseFreq: 329.63, pos: 0.60 },
      { key: "4", note: "G4", baseFreq: 392.00, pos: 0.55 },
      { key: "5", note: "A4", baseFreq: 440.00, pos: 0.50 },
      { key: "6", note: "C5", baseFreq: 523.25, pos: 0.45 },
      { key: "7", note: "D5", baseFreq: 587.33, pos: 0.40 }
    ];

    const stringState = scaleConfig.map(c => ({
      ...c,
      currentFreq: c.baseFreq,
      currentPos: c.pos,
      trackElem: null,
      bridgeElem: null
    }));

    function calcFrequency(baseFreq, relativePos) {
      return baseFreq * (0.6 / Math.max(0.15, relativePos));
    }

    stringState.forEach((item, index) => {
      const track = document.createElement('div');
      track.className = 'string-track';

      const wire = document.createElement('div');
      wire.className = 'string-wire';

      const bridge = document.createElement('div');
      bridge.className = 'asyq-bridge';
      bridge.style.bottom = `${item.pos * 100}%`;

      const label = document.createElement('div');
      label.className = 'note-label';
      label.innerText = `${item.key} (${item.note})`;

      track.appendChild(wire);
      track.appendChild(bridge);
      track.appendChild(label);
      stage.appendChild(track);

      item.trackElem = track;
      item.bridgeElem = bridge;

      const executePluck = () => {
        synthEngine.pluck(item.currentFreq);
        track.classList.add('plucked');
        setTimeout(() => track.classList.remove('plucked'), 180);
      };

      track.addEventListener('pointerdown', (e) => {
        if (e.target !== bridge) {
          executePluck();
        }
      });

      let dragging = false;
      bridge.addEventListener('pointerdown', (e) => {
        dragging = true;
        bridge.setPointerCapture(e.pointerId);
        e.stopPropagation();
      });

      bridge.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const rect = track.getBoundingClientRect();
        let newPos = 1 - ((e.clientY - rect.top) / rect.height);
        newPos = Math.max(0.15, Math.min(0.85, newPos));

        item.currentPos = newPos;
        bridge.style.bottom = `${newPos * 100}%`;
        item.currentFreq = calcFrequency(item.baseFreq, newPos);
      });

      const releaseDrag = (e) => {
        if (dragging) {
          dragging = false;
          try { bridge.releasePointerCapture(e.pointerId); } catch(err) {}
          executePluck();
        }
      };

      bridge.addEventListener('pointerup', releaseDrag);
      bridge.addEventListener('pointercancel', releaseDrag);
    });

    let swiping = false;
    stage.addEventListener('pointerdown', () => swiping = true);
    window.addEventListener('pointerup', () => swiping = false);

    stage.addEventListener('pointermove', (e) => {
      if (!swiping) return;
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.string-track');
      if (target) {
        const idx = Array.from(stage.children).indexOf(target);
        if (idx !== -1 && !target.classList.contains('plucked')) {
          synthEngine.pluck(stringState[idx].currentFreq, 0.75);
          target.classList.add('plucked');
          setTimeout(() => target.classList.remove('plucked'), 150);
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      const index = scaleConfig.findIndex(c => c.key === e.key);
      if (index !== -1) {
        synthEngine.pluck(stringState[index].currentFreq);
        stringState[index].trackElem.classList.add('plucked');
        setTimeout(() => stringState[index].trackElem.classList.remove('plucked'), 150);
      }
    });

    document.getElementById('resetTunings').addEventListener('click', () => {
      stringState.forEach((item, index) => {
        item.currentPos = scaleConfig[index].pos;
        item.currentFreq = scaleConfig[index].baseFreq;
        item.bridgeElem.style.bottom = `${item.currentPos * 100}%`;
      });
    });
  </script>
</body>
</html>
