<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhetigen Úni</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #e5c158;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .instrument {
      display: flex;
      gap: 18px;
      padding: 30px;
      background: #1a120b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .string {
      width: 28px;
      height: 280px;
      background: linear-gradient(90deg, #444, #d4af37, #444);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      font-weight: bold;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      user-select: none;
    }
    .string:active, .string.active {
      transform: scaleX(1.3);
      box-shadow: 0 0 15px #ffd700;
    }
  </style>
</head>
<body>

  <h2>Zhetigen úni</h2>
  <div class="instrument" id="zhetigen"></div>

  <script>
    const freqs = [
      { note: 'D4', f: 293.66 },
      { note: 'E4', f: 329.63 },
      { note: 'G4', f: 392.00 },
      { note: 'A4', f: 440.00 },
      { note: 'B4', f: 493.88 },
      { note: 'D5', f: 587.33 },
      { note: 'E5', f: 659.25 }
    ];

    let audioCtx = null;

    function playZhetigenString(freq) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const sampleRate = audioCtx.sampleRate;
      const duration = 2.5; // Dybystyń óshu uzaqtyǵy (sekund)
      const totalSamples = sampleRate * duration;
      const period = Math.round(sampleRate / freq);
      
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      // Shertu sátindegi alǵashqy aq shu (ishek soqqysy)
      for (let i = 0; i < period; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.8;
      }

      // Karplus-Strong terbelisi (aǵashtyń dástuirli jolyǵy men óshui)
      const damping = 0.991; 
      for (let i = period; i < totalSamples; i++) {
        data[i] = ((data[i - period] + data[i - period - 1]) * 0.5) * damping;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();
    }

    const container = document.getElementById('zhetigen');
    freqs.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'string';
      el.innerText = index + 1;
      
      const trigger = () => {
        playZhetigenString(item.f);
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 120);
      };

      el.addEventListener('pointerdown', trigger);
      el.addEventListener('pointerenter', (e) => {
        if (e.buttons === 1) trigger();
      });
      container.appendChild(el);
    });
  </script>
</body>
</html>
